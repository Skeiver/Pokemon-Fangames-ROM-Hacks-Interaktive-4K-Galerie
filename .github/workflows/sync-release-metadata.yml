name: Sync v1.0 release metadata

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update v1.0 release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Pokémon Fangames & ROM-Hacks – Interaktive 4K Galerie v1.0

          Erste öffentliche Basisversion der interaktiven 4K-Galerie mit 12 Pokémon-Fangames und ROM-Hacks.

          ## Enthalten
          - interaktive Standalone-HTML-Datei
          - ZIP-Paket mit HTML, README und NOTICE
          - vollständige Repository-Vorschau
          - vorbereiteter GitHub-Pages-Workflow

          ## GitHub Pages
          Die Live-Version ist technisch vollständig vorbereitet. Bei einem neu erstellten Repository muss unter **Settings → Pages → Build and deployment → Source** einmalig **GitHub Actions** ausgewählt werden. Anschließend übernimmt der vorhandene Workflow das Deployment automatisch.

          Vorgesehene Live-Adresse:
          https://skeiver.github.io/Pokemon-Fangames-ROM-Hacks-Interaktive-4K-Galerie/

          ## Hinweise
          ROM-Hacks werden nur über Projekt-/Patch-Seiten verlinkt. Dieses Repository enthält keine vorgepatchten proprietären Nintendo-ROMs.

          ## Integrität der HTML-Datei
          SHA-256: `8aebc7593933f37db0838c7ffb16a8da93b116848d71cb58326addea14145968`
          EOF

          gh release edit v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pokémon Fangames & ROM-Hacks – Interaktive 4K Galerie v1.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
