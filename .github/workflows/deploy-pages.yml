name: Validate gallery and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate published v1.0
        shell: bash
        run: |
          set -euo pipefail

          HTML="Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html"
          PREVIEW="assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp"
          HTML_SHA="8aebc7593933f37db0838c7ffb16a8da93b116848d71cb58326addea14145968"
          PREVIEW_SHA="7b44a6c3f2a14f5530bd971e2be813a1c803c98a998110329d0eb909b3f36722"

          test -s index.html
          test -s "$HTML"
          test -s "$PREVIEW"
          test "$(wc -c < index.html)" -eq 157154
          test "$(wc -c < "$HTML")" -eq 157154
          test "$(wc -c < "$PREVIEW")" -eq 48558
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$HTML_SHA"
          test "$(sha256sum "$HTML" | cut -d' ' -f1)" = "$HTML_SHA"
          test "$(sha256sum "$PREVIEW" | cut -d' ' -f1)" = "$PREVIEW_SHA"
          grep -qi '<!doctype html>' index.html
          grep -q 'Pokémon' index.html

          echo "### ✅ Galerie v1.0 validiert" >> "$GITHUB_STEP_SUMMARY"
          echo "- index.html: 157154 Bytes / SHA-256 korrekt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Standalone-v1.0: SHA-256 korrekt" >> "$GITHUB_STEP_SUMMARY"
          echo "- vollständige Vorschau: 48558 Bytes / SHA-256 korrekt" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect GitHub Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages.json 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ GitHub Pages ist aktiviert" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ GitHub Pages ist noch nicht einmalig aktiviert" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository → Settings → Pages → Build and deployment → Source: GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
            echo "Nach der Aktivierung diesen Workflow erneut starten." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
