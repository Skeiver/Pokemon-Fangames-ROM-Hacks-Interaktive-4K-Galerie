name: Validate gallery and deploy GitHub Pages

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Protect immutable v1.0 files
        shell: bash
        run: |
          set -euo pipefail
          echo "8aebc7593933f37db0838c7ffb16a8da93b116848d71cb58326addea14145968  Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html" | sha256sum --check --strict
          echo "7b44a6c3f2a14f5530bd971e2be813a1c803c98a998110329d0eb909b3f36722  assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp" | sha256sum --check --strict

      - name: Rebuild and compare v1.1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_v1_1.py
          python scripts/write_checksums.py
          git diff --exit-code -- index.html Pokemon_Fangames_ROM-Hacks_Galerie_v1.1.html SHA256SUMS.txt
          cmp --silent index.html Pokemon_Fangames_ROM-Hacks_Galerie_v1.1.html

      - name: Audit gallery structure and screenshots
        run: python scripts/audit_gallery.py --html index.html

      - name: Check inline JavaScript syntax
        run: python scripts/check_javascript.py --html index.html

      - name: Check external card links
        run: python scripts/audit_links.py --html index.html

      - name: Stage minimal Pages artifact
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R assets/screenshots _site/assets/screenshots

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 30 "$PAGE_URL" --output deployed.html; then
              break
            fi
            sleep 5
          done
          test -s deployed.html
          grep -q 'gallery-version" content="1.1' deployed.html
          test "$(grep -o 'class="game-card' deployed.html | wc -l)" -eq 12
          echo "Live smoke test passed: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
