name: Deploy interactive gallery to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare gallery release
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "bootstrap=false" >> "$GITHUB_OUTPUT"

          gallery01_parts=$(find .source -maxdepth 1 -type f -name 'gallery01.part*.b64' 2>/dev/null | wc -l || true)
          preview_parts=$(find .source -maxdepth 1 -type f -name 'preview2.part*.b64' 2>/dev/null | wc -l || true)

          if [ "$gallery01_parts" -eq 3 ] \
             && [ -f .source/gallery.part02.b64 ] \
             && [ -f .source/gallery.part03.b64 ] \
             && [ "$preview_parts" -eq 4 ]; then

            {
              cat .source/gallery01.part*.b64
              cat .source/gallery.part02.b64
              cat .source/gallery.part03.b64
            } | base64 --decode \
              | gzip --decompress \
              > Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html

            mkdir -p assets
            cat .source/preview2.part*.b64 \
              | base64 --decode \
              > assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp

            cp Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html index.html

            # Schutz gegen Teil-/Fehlübertragungen.
            test -s index.html
            test -s Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html
            test -s assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp
            test "$(wc -c < Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html)" -eq 172778
            test "$(wc -c < assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp)" -eq 48558
            test "$(sha256sum Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html | cut -d' ' -f1)" = "293c1f4e03ecbc1749c1ad330907f5e66199c8e75d47ef47128e38da141ba379"
            test "$(sha256sum assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp | cut -d' ' -f1)" = "5b26814629748badc8b61b44e705125c78140bad22b1c53108b5e738edc37a8a"
            grep -q '<!DOCTYPE html>' index.html
            grep -q 'Pokémon' index.html

            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"

          elif [ -s index.html ] && [ -s Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Bootstrap noch nicht vollständig – Deployment wird übersprungen."
          fi

      - name: Commit final release files and remove bootstrap data
        if: steps.bootstrap.outputs.bootstrap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Veröffentliche Galerie v1.0 und vollständige Vorschau"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static gallery
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.bootstrap.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
