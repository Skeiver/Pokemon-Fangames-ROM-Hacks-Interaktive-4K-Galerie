name: Deploy interactive gallery to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare gallery release
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "bootstrap=false" >> "$GITHUB_OUTPUT"

          # Bootstrap nur atomar ausführen: HTML UND vollständige Vorschau
          # müssen beide vorhanden sein. So kann niemals eine Teil-Datei als
          # Release veröffentlicht werden.
          if [ -f .source/gallery.html.gz.b64 ] && [ -f .source/preview.webp.b64 ]; then
            base64 --decode .source/gallery.html.gz.b64 \
              | gzip --decompress \
              > Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html

            cp Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html index.html

            mkdir -p assets
            base64 --decode .source/preview.webp.b64 \
              > assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp

            # Mindestprüfungen gegen unvollständige/defekte Bootstrap-Daten.
            test -s index.html
            test -s Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html
            test -s assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp
            grep -q '<!DOCTYPE html>' index.html
            grep -q 'Pokémon' index.html

            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          elif [ -s index.html ] && [ -s Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html ]; then
            # Nach dem einmaligen Bootstrap wird bei normalen Commits direkt
            # der bereits veröffentlichte Repository-Stand deployed.
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Bootstrap noch nicht vollständig – Deployment wird übersprungen."
          fi

      - name: Commit final release files and remove bootstrap data
        if: steps.bootstrap.outputs.bootstrap == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Veröffentliche Galerie v1.0 und vollständige Vorschau"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static gallery
        if: steps.bootstrap.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.bootstrap.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
