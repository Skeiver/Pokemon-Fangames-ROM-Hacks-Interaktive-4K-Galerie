name: Deploy interactive gallery to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct gallery source when bootstrap data exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .source/gallery.html.gz.b64 ]; then
            base64 --decode .source/gallery.html.gz.b64 | gzip --decompress > Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html
            cp Pokemon_Fangames_ROM-Hacks_Galerie_v1.0.html index.html
          fi
          if compgen -G '.source/preview.part*.b64' > /dev/null; then
            mkdir -p assets
            cat .source/preview.part*.b64 | base64 --decode > assets/Pokemon_Fangames_ROM-Hacks_Galerie_v1.0_preview.webp
          fi

      - name: Commit reconstructed release files
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .source ]; then
            rm -rf .source
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Veröffentliche Galerie v1.0 und vollständige Vorschau"
              git push
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static gallery
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
